name: Update flutter_distributor

on:
  schedule:
    - cron: '0 1 * * *'  # 每天 UTC 01:00（北京时间 09:00）自动检查上游
  workflow_dispatch:
    inputs:
      force:
        description: 'Fork 与上游分叉时强制对齐上游（丢弃 fork 独有提交）'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUBMODULE_PATH: plugins/flutter_distributor
  BRANCH: FlClash
  UPSTREAM_URL: https://github.com/chen08209/flutter_distributor.git
  FORK_REPO: Filterrr/flutter_distributor

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream and Sync Fork
        id: sync
        env:
          FORCE: ${{ github.event.inputs.force == 'true' }}
          FORK_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          cd ${{ env.SUBMODULE_PATH }}

          # 当前子模块指针
          OLD_COMMIT=$(git rev-parse HEAD)
          echo "old_commit=$OLD_COMMIT" >> $GITHUB_OUTPUT
          echo "old_commit_short=${OLD_COMMIT:0:7}" >> $GITHUB_OUTPUT

          # 拉取上游
          git remote add upstream ${{ env.UPSTREAM_URL }} 2>/dev/null || true
          git fetch upstream ${{ env.BRANCH }}
          NEW_COMMIT=$(git rev-parse upstream/${{ env.BRANCH }})
          echo "new_commit=$NEW_COMMIT" >> $GITHUB_OUTPUT
          echo "new_commit_short=${NEW_COMMIT:0:7}" >> $GITHUB_OUTPUT

          echo "Current commit: ${OLD_COMMIT:0:7}"
          echo "Upstream commit: ${NEW_COMMIT:0:7}"

          if [ "$OLD_COMMIT" = "$NEW_COMMIT" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date."
            exit 0
          fi

          echo "has_update=true" >> $GITHUB_OUTPUT
          echo "branch_name=update-flutter-distributor/$(date +%Y%m%d)-${NEW_COMMIT:0:7}" >> $GITHUB_OUTPUT

          # 更新日志（旧提交可能因上游改写历史而缺失，失败不影响流程）
          {
            echo "## Update Log"
            git log --oneline "$OLD_COMMIT..upstream/${{ env.BRANCH }}" 2>/dev/null || echo "(旧提交不在上游历史中)"
          } > /tmp/update_log.md

          # 同步 fork 分支
          git checkout ${{ env.BRANCH }}
          if git merge-base --is-ancestor HEAD upstream/${{ env.BRANCH }}; then
            git merge --ff-only upstream/${{ env.BRANCH }}
            FORCE_FLAGS=()
          elif [ "$FORCE" = "true" ]; then
            echo "Fork diverged, force aligning to upstream."
            git reset --hard upstream/${{ env.BRANCH }}
            FORCE_FLAGS=(--force)
          else
            echo "::error::Fork 与上游已分叉，请手动触发并勾选 force 以强制对齐上游"
            exit 1
          fi

          # 推送到 fork（需要 FORK_SYNC_TOKEN 对 fork 仓库的写权限）
          if [ -z "$FORK_TOKEN" ]; then
            echo "::error::缺少 secret FORK_SYNC_TOKEN（对 Filterrr/flutter_distributor 有写权限的 PAT）"
            exit 1
          fi
          git push "https://x-access-token:${FORK_TOKEN}@github.com/${{ env.FORK_REPO }}.git" ${{ env.BRANCH }} "${FORCE_FLAGS[@]}"

      - name: Update Submodule Pointer
        if: steps.sync.outputs.has_update == 'true'
        run: |
          git add ${{ env.SUBMODULE_PATH }}
          git commit -m 'chore: update flutter_distributor to ${{ steps.sync.outputs.new_commit_short }}'
          git push origin "HEAD:${{ steps.sync.outputs.branch_name }}" --force

      - name: Create Pull Request
        if: steps.sync.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.sync.outputs.branch_name }}" \
            --title 'chore: update flutter_distributor to ${{ steps.sync.outputs.new_commit_short }}' \
            --body "## flutter_distributor Update

          同步上游 [chen08209/flutter_distributor](https://github.com/chen08209/flutter_distributor) 到 fork 并更新子模块指针。

          ### Changes
          - **Old Commit**: \`${{ steps.sync.outputs.old_commit_short }}\` (${{ steps.sync.outputs.old_commit }})
          - **New Commit**: \`${{ steps.sync.outputs.new_commit_short }}\` (${{ steps.sync.outputs.new_commit }})

          ### Update Log
          \`\`\`
          $(cat /tmp/update_log.md)
          \`\`\`

          > Auto-generated by [Update flutter_distributor Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            || echo "PR already exists or failed to create"

      - name: No Update Needed
        if: steps.sync.outputs.has_update != 'true'
        run: |
          echo "flutter_distributor 已是最新。"
          echo "Current commit: ${{ steps.sync.outputs.old_commit_short }}"
