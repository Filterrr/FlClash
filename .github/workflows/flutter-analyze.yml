name: Flutter Analyze & Test

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.x'
          cache: true

      - name: Prepare Dependencies
        run: |
          flutter pub get
          dart run build_runner build -d || true

      - name: Analyze
        # Scope to app code: vendored plugins/ and packages/ carry
        # pre-existing analyzer noise unrelated to this repository's app.
        run: flutter analyze lib test

      - name: Test
        # Exclude test/command_test.dart: it is a manual integration harness
        # that requires a running clash core listening on a unix socket,
        # so it can never pass in CI.
        run: flutter test --exclude-tags=none $(ls test/*_test.dart | grep -v command_test | tr '\n' ' ')
