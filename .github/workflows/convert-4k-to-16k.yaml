name: Convert 4K to 16K

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty to use build time)'
        required: false
        type: string
        default: ''
      source_ref:
        description: 'Source branch or tag to build from (default: current branch)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name }}
  IS_STABLE: ${{ (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-')) || (inputs.tag_name != '' && !contains(inputs.tag_name, '-')) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert-4k-to-16k:
    name: Build 16K ${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            arch: universal
            is_android: true
            go_version: '1.25.x'
            flutter_channel: 'stable'

          - platform: windows
            os: windows-latest
            arch: amd64
            go_version: '1.25.x'
            flutter_channel: 'stable'
            flutter_version: '3.x'
          - platform: windows
            os: windows-latest
            arch: arm64
            go_version: '1.25.x'
            flutter_channel: 'stable'
            flutter_version: '3.x'

          - platform: macos
            os: macos-latest
            arch: arm64
            go_version: '1.25.x'
            flutter_channel: 'stable'
            flutter_version: '3.x'
          - platform: macos
            os: macos-latest
            arch: amd64
            go_version: '1.25.x'
            flutter_channel: 'stable'
            flutter_version: '3.x'

          - platform: linux
            os: ubuntu-latest
            arch: amd64
            go_version: '1.25.x'
            flutter_channel: 'stable'
            flutter_version: '3.x'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        if: matrix.is_android == true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup NDK
        if: matrix.is_android == true
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true
          link-to-sdk: true

      - name: Setup Rust
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'x86_64-pc-windows-msvc'

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go_version }}
          cache-dependency-path: core/go.sum

      - name: Update Go Dependencies
        run: |
          cd core
          go mod tidy

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter_channel }}
          cache: true
          cache-key: flutter-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('**/pubspec.lock') }}
          flutter-version: ${{ matrix.flutter_version || '3.x' }}

      - name: Prepare Dependencies
        run: |
          flutter pub get
          dart run build_runner build -d || true

      - name: Patch Android build.gradle for 16K Page Size
        if: matrix.is_android == true
        run: |
          cat <<'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'androidx.camera:camera-core:1.4.0'
                      force 'androidx.camera:camera-camera2:1.4.0'
                      force 'androidx.camera:camera-lifecycle:1.4.0'
                      force 'androidx.camera:camera-video:1.4.0'
                      force 'androidx.camera:camera-view:1.4.0'
                      force 'com.google.mlkit:barcode-scanning:17.3.0'
                      force 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
                  }
              }
          }
          EOF

      - name: Inject 16K Page Size for Go Linker (Android)
        if: matrix.is_android == true
        run: echo "CGO_LDFLAGS=-Wl,-z,max-page-size=16384" >> $GITHUB_ENV

      - name: Build Platform
        run: dart setup.dart ${{ matrix.platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) || '' }}

      - name: Verify 16K Alignment of Native Libraries
        if: matrix.is_android == true
        run: |
          echo "Verifying 16K page size alignment for native .so files..."
          NDK_TOOLCHAIN="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          FOUND_4K=0
          FOUND_16K=0
          for so in ./libclash/android/*/libclash.so; do
            if [ -f "$so" ]; then
              echo "Checking: $so"
              MAX_PAGE=$("$NDK_TOOLCHAIN/llvm-readelf" -l "$so" 2>/dev/null | grep LOAD | head -1 | awk '{print $NF}')
              ALIGN=$("$NDK_TOOLCHAIN/llvm-readelf" -l "$so" 2>/dev/null | grep LOAD | head -1 | awk '{print $(NF-1)}')
              echo "  Alignment: $ALIGN"
              if [ "$ALIGN" = "0x4000" ] || [ "$ALIGN" = "16384" ]; then
                echo "  -> 16K aligned"
                FOUND_16K=$((FOUND_16K + 1))
              else
                echo "  -> Possibly 4K aligned ($ALIGN)"
                FOUND_4K=$((FOUND_4K + 1))
              fi
            fi
          done
          echo "Summary: $FOUND_16K file(s) 16K-aligned, $FOUND_4K file(s) possibly 4K-aligned"
          if [ "$FOUND_4K" -gt 0 ]; then
            echo "WARNING: Some .so files may not be 16K aligned!"
          fi

      - name: Sign Android APKs with Fixed Keystore
        if: matrix.is_android == true
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | grep -v "\.bat$" | sort -r | head -n 1)
          for apk in ./dist/*.apk; do
            if [ -f "$apk" ]; then
              echo "Applying consistent signature to $apk"
              $APKSIGNER sign --ks release.keystore \
                --ks-pass env:KEYSTORE_PASSWORD \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass env:KEY_PASSWORD \
                "$apk"
            fi
          done
          rm release.keystore

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: FlClash-16k-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: ./dist
          overwrite: true

  upload:
    permissions: write-all
    needs: [convert-4k-to-16k]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Build Time Tag if Empty
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            BUILD_TAG="v$(date +'%Y%m%d-%H%M%S')-16k"
            echo "RELEASE_TAG=${BUILD_TAG}" >> $GITHUB_ENV
            echo "IS_STABLE=true" >> $GITHUB_ENV
            echo "No tag specified, auto-generated: ${BUILD_TAG}"
          fi

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: FlClash-16k-*
          merge-multiple: true

      - name: Remove Android v4 Signature Files (.idsig)
        run: |
          rm -f ./dist/*.idsig

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ./dist/*
          body_path: './release.md'
